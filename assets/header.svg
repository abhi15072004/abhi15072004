<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Abhishek Tiwari — I build software that's running in restaurants, retail stores, showrooms and loan offices">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1D2944" stroke-width="1"/>
    </pattern>
    <radialGradient id="fadeMask" cx="25%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m"><rect width="900" height="280" fill="url(#fadeMask)"/></mask>
    <radialGradient id="glow" cx="88%" cy="0%" r="60%">
      <stop offset="0" stop-color="#3BE0A0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#3BE0A0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="wordClip"><rect x="40" y="150" width="600" height="62"/></clipPath>
    <clipPath id="card"><rect width="900" height="280" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .h { font-weight: 800; font-size: 50px; fill: #E9EEF6; letter-spacing: -1.5px; }
    .w { font-weight: 800; font-size: 50px; fill: #3BE0A0; letter-spacing: -1.5px; opacity: 0; animation: word 12s infinite; }
    .w2 { animation-delay: 3s; } .w3 { animation-delay: 6s; } .w4 { animation-delay: 9s; }
    @keyframes word {
      0% { opacity: 0; transform: translateY(40px); }
      4%, 22% { opacity: 1; transform: translateY(0); }
      27%, 100% { opacity: 0; transform: translateY(-40px); }
    }
    .rise { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
    .r2 { animation-delay: .12s; } .r3 { animation-delay: .24s; } .r4 { animation-delay: .4s; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .ping { transform-origin: 59px 47px; animation: ping 2s cubic-bezier(.2,.8,.2,1) infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(3.2); opacity: 0; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateX(-200px); } to { transform: translateX(1100px); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="280" fill="#0A0F1C"/>
    <rect width="900" height="280" fill="url(#grid)" mask="url(#m)"/>
    <rect width="900" height="280" fill="url(#glow)"/>
    <rect class="scan" x="0" y="0" width="160" height="280" fill="#3BE0A0" opacity=".035"/>
  </g>
  <rect x=".5" y=".5" width="899" height="279" rx="20" fill="none" stroke="#1D2944"/>

  <!-- pill -->
  <g class="rise">
    <rect x="40" y="32" width="300" height="30" rx="15" fill="#0F1729" stroke="#1D2944"/>
    <circle class="ping" cx="59" cy="47" r="4" fill="#3BE0A0"/>
    <circle cx="59" cy="47" r="4" fill="#3BE0A0"/>
    <text x="72" y="52" class="mono" font-size="13" fill="#3BE0A0">Open to work</text>
    <text x="178" y="52" class="mono" font-size="13" fill="#8D99B1">· full-time · 2027</text>
  </g>

  <text x="40" y="128" class="sans h rise r2">I build software that's running in</text>

  <g clip-path="url(#wordClip)" class="rise r3">
    <text x="40" y="196" class="sans w w1">restaurants.</text>
    <text x="40" y="196" class="sans w w2">retail stores.</text>
    <text x="40" y="196" class="sans w w3">showrooms.</text>
    <text x="40" y="196" class="sans w w4">loan offices.</text>
  </g>

  <g class="rise r4">
    <text x="40" y="246" class="mono" font-size="14" fill="#8D99B1">$ whoami <tspan fill="#E9EEF6">Abhishek Tiwari</tspan> — full stack · Go · Flutter · Next.js · Node.js<tspan class="cursor" fill="#3BE0A0"> ▍</tspan></text>
  </g>

  <!-- mark -->
  <g transform="translate(812 32)">
    <rect width="48" height="48" rx="12" fill="#E9EEF6"/>
    <text x="24" y="31" text-anchor="middle" class="sans" font-weight="800" font-size="19" fill="#0A0F1C">AT</text>
  </g>
</svg>
