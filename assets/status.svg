<svg xmlns="http://www.w3.org/2000/svg" width="900" height="392" viewBox="0 0 900 392" role="img" aria-label="Deployments: RidgePoS product site, owner dashboard and licensing console, tryfoodway.com, touchonled.com and gemsprofino.com are live; groweladvisory.com is launching; EcomHub and Pathshala are being built">
  <defs>
    <clipPath id="card"><rect width="900" height="392" rx="18"/></clipPath>
    <linearGradient id="sheen" x1="0" x2="1">
      <stop offset="0" stop-color="#3BE0A0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#3BE0A0" stop-opacity=".07"/>
      <stop offset="1" stop-color="#3BE0A0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .host { font-size: 14px; fill: #E9EEF6; font-weight: 500; }
    .what { font-size: 12px; fill: #8D99B1; }
    .tag { font-size: 11.5px; font-weight: 600; letter-spacing: .6px; }
    .row { animation: in .7s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes in { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2s cubic-bezier(.2,.8,.2,1) infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(3); opacity: 0; } }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: beat 1.8s ease-in-out infinite; fill: #3BE0A0; opacity: .6; }
    @keyframes beat { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    .amber { fill: #FFB547; }
    .build { transform-box: fill-box; transform-origin: left; animation: build 3.2s ease-in-out infinite; }
    @keyframes build { 0% { transform: scaleX(.15); } 70%, 100% { transform: scaleX(1); opacity: 0; } }
    .sheen { animation: sheen 5s linear infinite; }
    @keyframes sheen { from { transform: translateY(-80px); } to { transform: translateY(420px); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="392" fill="#0F1729"/>
    <rect width="900" height="52" fill="#131D33"/>
    <rect class="sheen" x="0" y="0" width="900" height="60" fill="url(#sheen)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="391" rx="18" fill="none" stroke="#1D2944"/>
